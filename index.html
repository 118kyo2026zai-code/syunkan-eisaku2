<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>瞬間英作文音声練習ドリル</title>

<style>

body{
  font-family:sans-serif;
  text-align:center;

  min-height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:20px;
  box-sizing:border-box;
}


/* 最初の準備画面 */

#setupArea{
  max-width:700px;
  margin:0 auto 30px auto;
}

#setupMessage{
  font-size:28px;
  font-weight:bold;
  line-height:1.6;
  margin-bottom:25px;
}

.setupButton{
  width:320px;
  height:80px;
  font-size:28px;
  border-radius:15px;
  cursor:pointer;
  margin:10px auto;
  display:block;
}

#voiceCheckButton{
  background:#eeeeee;
  border:3px solid #999999;
}

#micButton{
  background:#ffd966;
  border:3px solid #cc9900;
}

#startPracticeButton{
  background:#d9ead3;
  border:3px solid #6aa84f;
}

#setupStatus{
  font-size:22px;
  min-height:35px;
  margin-top:15px;
  line-height:1.5;
}

#practiceArea{
  display:none;
}


#unitSelect{
  width:220px;
  font-size:24px;
  padding:8px;
  display:block;
  margin:0 auto 15px auto;
}


#ja{
  font-size:45px;
  font-weight:bold;
  margin-bottom:20px;
  line-height:1.4;
}


#answer{
  margin-top:10px;
  font-size:40px;
  color:blue;
  line-height:1.4;
}


input{
  width:90%;
  max-width:700px;
  font-size:30px;
  padding:15px;
  display:block;
  margin:20px auto;
  text-align:center;
}


.button-area{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:25px;
  margin-top:20px;
}


button{
  width:280px;
  height:90px;
  font-size:32px;
  border-radius:15px;
  cursor:pointer;
}


#result{
  margin-top:25px;
  font-size:28px;
  white-space:pre-line;
}


@media (max-width:600px){

  #setupMessage{
    font-size:22px;
  }

  .setupButton{
    width:280px;
    height:75px;
    font-size:25px;
  }

  #setupStatus{
    font-size:19px;
  }

  #unitSelect{
    font-size:34px;
  }

  #ja{
    font-size:20px;
  }

  #answer{
    font-size:20px;
  }

  input{
    font-size:15px;
  }

  button{
    width:260px;
    height:80px;
    font-size:33px;
  }

  #result{
    font-size:20px;
  }

}

</style>
</head>

<body>


<!-- 最初の準備画面 -->

<div id="setupArea">

  <div id="setupMessage">
    準備
  </div>


  <button
    id="voiceCheckButton"
    class="setupButton"
    onclick="checkVoice()">
    音声を確認
  </button>


  <button
    id="micButton"
    class="setupButton"
    onclick="allowMicrophone()"
    style="display:none;">
    マイクを許可
  </button>


  <button
    id="startPracticeButton"
    class="setupButton"
    onclick="startPractice()"
    style="display:none;">
    練習を始める
  </button>


  <div id="setupStatus"></div>

</div>


<!-- 実際の練習画面 -->

<div id="practiceArea">

  <select id="unitSelect" onchange="changeUnit()">

    <option value="all">全部</option>

    <option value="肯定文第三文型">肯定文第三文型</option>

    <option value="疑問文第三文型">疑問文第三文型</option>

    <option value="命令文第三文型">命令文第三文型</option>

    <option value="疑問詞③">疑問詞③</option>

  </select>


  <h2 id="ja"></h2>

  <div id="result"></div>

  <div id="answer"></div>


  <input
    id="voiceText"
    type="text"
    placeholder="ここに認識結果が表示されます"
  >


  <div class="button-area">

    <button onclick="stop()">判定</button>

    <button onclick="nextQuestion()">次の問題</button>

    <button onclick="repeatAudio()">もう一回聞く</button>

  </div>

</div>


<script src="data.js"></script>


<script>

let current = 0;

let currentData = data;

let speech = null;

let latestText = "";

let wrongQuestions = [];


// 現在、音声認識を続けたい状態かどうか
let shouldListen = false;


// 「判定」を実行しているか
let isJudging = false;


// 音声認識を開始処理中かどうか
let isStarting = false;


// 判定待ちかどうか
let judgePending = false;


// マイク許可済みか
let microphoneReady = false;


// 音声確認済みか
let voiceReady = false;



function normalize(text){

  return text
    .toLowerCase()
    .replace(/[.,!?]/g,"")
    .trim();

}



const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;



if(SpeechRecognition){

  speech = new SpeechRecognition();

  speech.lang = "en-US";

  speech.continuous = true;

  speech.interimResults = false;



  /*
    音声認識スタート
  */

  speech.onstart = function(){

    console.log("音声認識スタート");

    isStarting = false;


    /*
      最初の「マイクを許可」で
      音声認識が開始された場合
    */

    if(!microphoneReady){

      microphoneReady = true;


      document.getElementById(
        "micButton"
      ).style.display = "none";


      document.getElementById(
        "startPracticeButton"
      ).style.display = "block";


      document.getElementById(
        "setupStatus"
      ).innerText =
        "マイクの準備ができました。\n「練習を始める」を押してください。";

    }

  };



  /*
    音声を認識したとき
  */

  speech.onresult = function(e){

    latestText =
      e.results[e.results.length - 1][0].transcript;


    document.getElementById(
      "voiceText"
    ).value = latestText;

  };



  /*
    音声認識が終了したとき
  */

  speech.onend = function(){

    console.log("音声認識終了");

    isStarting = false;


    /*
      判定待ちなら判定する
    */

    if(judgePending){

      judgePending = false;

      judge();

      return;

    }


    /*
      練習中なら自動的に再開
    */

    if(shouldListen && !isJudging){

      setTimeout(function(){

        startRecognition();

      },500);

    }

  };



  /*
    音声認識エラー
  */

  speech.onerror = function(event){

    console.log(
      "音声認識エラー:",
      event.error
    );

    isStarting = false;


    /*
      マイク許可前のエラー
    */

    if(!microphoneReady){

      if(
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ){

        document.getElementById(
          "micButton"
        ).disabled = false;


        document.getElementById(
          "setupStatus"
        ).innerText =
          "マイクが許可されませんでした。\nChromeのマイク設定を確認してください。";


        return;

      }

    }


    /*
      無音は特に表示しない
    */

    if(event.error === "no-speech"){

      return;

    }


    /*
      マイク使用不可
    */

    if(
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ){

      shouldListen = false;


      document.getElementById(
        "result"
      ).innerText =
        "マイクが使えません。\n" +
        "設定＞アプリ＞Chrome＞マイク「許可」にしてください。";


      return;

    }


    if(!isJudging){

      document.getElementById(
        "result"
      ).innerText =
        "マイクを確認してください。";

    }

  };


}else{

  alert(
    "このブラウザは音声認識に対応していません"
  );

}



/*
  最初の音声確認
*/

function checkVoice(){

  const button =
    document.getElementById(
      "voiceCheckButton"
    );


  const status =
    document.getElementById(
      "setupStatus"
    );


  button.disabled = true;

  button.innerText =
    "音声を確認しています";


  status.innerText =
    "少しお待ちください。";


  const synth =
    window.speechSynthesis;


  /*
    ここでは今まで成功した
    音声確認の方法をそのまま使用
  */

  synth.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      "Hello."
    );


  utterance.lang = "en-US";

  utterance.rate = 1.0;


  utterance.onend = function(){

    voiceReady = true;


    button.style.display = "none";


    document.getElementById(
      "micButton"
    ).style.display = "block";


    status.innerText =
      "音声の確認ができました。\n次に「マイクを許可」を押してください。";

  };


  utterance.onerror = function(){

    button.disabled = false;

    button.innerText =
      "音声を確認";


    status.innerText =
      "音声を確認できませんでした。\nもう一度押してください。";

  };


  synth.speak(utterance);

}



/*
  マイクを許可する
*/

function allowMicrophone(){

  if(!speech){

    return;

  }


  if(!voiceReady){

    return;

  }


  const button =
    document.getElementById(
      "micButton"
    );


  button.disabled = true;


  document.getElementById(
    "setupStatus"
  ).innerText =
    "マイクを準備しています。";


  /*
    ここが今回の重要な修正。

    マイクを起動してすぐ停止するのではなく、
    そのまま音声認識を開始する。
  */

  microphoneReady = false;

  shouldListen = true;

  isJudging = false;

  judgePending = false;

  latestText = "";


  startRecognition();

}



/*
  練習開始
*/

function startPractice(){

  if(!microphoneReady){

    return;

  }


  document.getElementById(
    "setupArea"
  ).style.display = "none";


  document.getElementById(
    "practiceArea"
  ).style.display = "block";


  /*
    すでにマイクは起動しているので、
    ここでは再起動しない
  */

  shouldListen = true;

  isJudging = false;

  judgePending = false;

  latestText = "";


  showQuestion();

}



/*
  問題表示
*/

function showQuestion(){

  document.getElementById("ja").innerText =
    currentData[current].ja;


  document.getElementById("answer").innerText =
    "";


  document.getElementById("result").innerText =
    "";


  document.getElementById("voiceText").value =
    "";


  latestText = "";

}



/*
  正解英文を読み上げる
*/

function speakAnswer(message){

  const synth =
    window.speechSynthesis;


  const utterance =
    new SpeechSynthesisUtterance(message);


  utterance.lang = "en-US";

  utterance.rate = 1.0;


  synth.speak(utterance);

}



/*
  実際に音声認識を開始する処理
*/

function startRecognition(){

  if(!speech){

    return;

  }


  if(!shouldListen){

    return;

  }


  if(isJudging){

    return;

  }


  if(isStarting){

    return;

  }


  isStarting = true;


  try{

    speech.start();

  }catch(error){

    console.log(
      "音声認識開始エラー:",
      error
    );


    isStarting = false;


    if(shouldListen && !isJudging){

      setTimeout(function(){

        startRecognition();

      },800);

    }

  }

}



/*
  「判定」ボタン
*/

function stop(){

  shouldListen = false;

  isJudging = true;

  judgePending = true;


  if(speech){

    try{

      speech.stop();

    }catch(error){

      console.log(error);

    }

  }

}



/*
  実際の判定
*/

function judge(){

  const user =
    normalize(latestText);


  const correct =
    normalize(currentData[current].en);


  if(user === correct){

    document.getElementById(
      "result"
    ).innerText =
      "◎ 正解！";


    document.getElementById(
      "answer"
    ).innerText =
      currentData[current].en;


    speakAnswer(
      currentData[current].en
    );

  }

  else{

    document.getElementById(
      "result"
    ).innerText =
      "❌ ちがいます";


    document.getElementById(
      "answer"
    ).innerText =
      currentData[current].en;


    if(
      !wrongQuestions.includes(
        currentData[current]
      )
    ){

      wrongQuestions.push(
        currentData[current]
      );

    }


    speakAnswer(
      currentData[current].en
    );

  }

}



/*
  次の問題
*/

function nextQuestion(){

  speechSynthesis.cancel();


  judgePending = false;

  shouldListen = false;

  isJudging = false;


  if(speech){

    try{

      speech.stop();

    }catch(error){

      console.log(error);

    }

  }


  current++;


  if(current >= currentData.length){

    if(wrongQuestions.length > 0){

      currentData =
        [...wrongQuestions];


      wrongQuestions = [];

      current = 0;


      alert(
        "復習スタート！\n間違えた問題をもう一度やります。"
      );

    }

    else{

      alert("クリア！");


      current = 0;

      showQuestion();


      document.getElementById(
        "setupArea"
      ).style.display = "block";


      document.getElementById(
        "practiceArea"
      ).style.display = "none";


      document.getElementById(
        "voiceCheckButton"
      ).style.display = "block";


      document.getElementById(
        "voiceCheckButton"
      ).disabled = false;


      document.getElementById(
        "voiceCheckButton"
      ).innerText =
        "音声を確認";


      document.getElementById(
        "micButton"
      ).style.display = "none";


      document.getElementById(
        "startPracticeButton"
      ).style.display = "none";


      document.getElementById(
        "setupStatus"
      ).innerText = "";


      voiceReady = false;

      microphoneReady = false;


      return;

    }

  }


  showQuestion();


  setTimeout(function(){

    shouldListen = true;

    isJudging = false;

    startRecognition();

  },500);

}



/*
  「もう一回聞く」
*/

function repeatAudio(){

  speakAnswer(
    currentData[current].en
  );

}



/*
  問題を切り替えたとき
*/

function changeUnit(){

  judgePending = false;

  shouldListen = false;

  isJudging = false;


  if(speech){

    try{

      speech.stop();

    }catch(error){

      console.log(error);

    }

  }


  const selected =
    document.getElementById(
      "unitSelect"
    ).value;


  if(selected === "all"){

    currentData = data;

  }

  else{

    currentData =
      data.filter(
        q => q.unit === selected
      );

  }


  current = 0;


  showQuestion();


  /*
    ユニット変更後も
    音声認識を再開
  */

  setTimeout(function(){

    shouldListen = true;

    isJudging = false;

    startRecognition();

  },500);

}



/*
  最初の問題を表示
*/

showQuestion();

</script>

</body>
</html>
